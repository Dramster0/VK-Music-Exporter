name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node browser-extension/verify.cjs
      - run: node browser-extension/verify-panel.cjs
      - name: Check JavaScript syntax
        run: |
          for file in browser-extension/*.js; do node --check "$file"; done
